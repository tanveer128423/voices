<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voices — MetalLabs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sticky top bar -->
  <header class="topbar">
    <nav class="breadcrumb">
      <span class="bc-muted">Platform</span>
      <span class="bc-slash">/</span>
      <span class="bc-current">Voices</span>
    </nav>
    <div class="topbar-right">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <span class="tt-icon" id="ttIcon">☾</span>
      </button>
      <span class="tb-avatar">K</span>
    </div>
  </header>

  <main class="page">
    <!-- Page header -->
    <div class="page-head">
      <div class="ph-left">
        <h1 class="page-title">Voices</h1>
        <p class="page-sub">Browse, preview, and copy voice IDs for your agents.</p>
      </div>

      <div class="provider-tabs" id="providerTabs">
        <button class="ptab" data-provider="azure">Azure</button>
        <button class="ptab active" data-provider="xai">xAI</button>
      </div>
    </div>

    <!-- Search -->
    <div class="ml-input search">
      <span class="search-icon">⌕</span>
      <input id="search" type="text" placeholder="Search by name, accent, language, use case…" />
      <span class="voice-count" id="voiceCount"></span>
    </div>

    <!-- Grid -->
    <div class="voice-grid" id="voiceGrid"></div>
    <div class="list-status" id="listStatus"></div>
  </main>

  <audio id="player"></audio>
  <script src="app.js"></script>
</body>
</html>
