<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetalLabs — AI Voice Platform</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="voices-main">
    <div class="voices-wrap">
      <!-- Header -->
      <div class="voices-head">
        <div>
          <h1 class="voices-title">Voices</h1>
          <p class="voices-sub">Browse, preview, and copy voice IDs for your agents.</p>
        </div>
        <div class="voices-head-right">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="tt-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="tt-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <div class="ml-segment" id="providerTabs">
          <button data-provider="elevenlabs" data-active="false">ElevenLabs</button>
          <button data-provider="cartesia" data-active="false">Cartesia</button>
          <button data-provider="fishaudio" data-active="false">Fish Audio</button>
          <button data-provider="google" data-active="false">Google</button>
          <button data-provider="azure" data-active="false">Azure MAI</button>
          <button data-provider="xai" data-active="true">xAI</button>
        </div>
        </div>
      </div>

      <!-- Search -->
      <div class="voices-search">
        <svg class="vs-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.35-5.4a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z"></path>
        </svg>
        <input id="search" class="ml-input vs-input" placeholder="Search by name, accent, language, use case…" />
      </div>

      <!-- Grid -->
      <div class="voices-grid" id="voiceGrid"></div>
      <div class="list-status" id="listStatus"></div>
    </div>
  </main>

  <audio id="player"></audio>
  <script src="app.js"></script>
</body>
</html>
